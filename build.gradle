plugins {
    id "com.gradleup.shadow" version "9.4.1" apply false
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
    id "net.neoforged.licenser" version "0.7.5" apply false
    id "org.redlance.dima_dencep.gradle.machete"  version "1.0.2" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "org.redlance.dima_dencep.gradle.machete"
    apply plugin: "net.neoforged.licenser"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }

    machete {
        tasks.set(Collections.singleton("shadowJar"))
        sourceFileStriping.enabled = true

        png.compressionLevel.set(9)
        png.compressorIterations.set(32)
        png.enabled = false
    }

    license {
        header = rootProject.file('HEADER')
        skipExistingHeaders = false

        tasks {
            oe {
                files.from rootProject.fileTree("src", {
                    include "**/*.java"
                })
            }
        }
    }

    processResources {
        inputs.property "version", version
        inputs.property "minecraft_version", minecraft_version
        inputs.property "fabric_version", loader_version
        inputs.property "neo_version", forge_version
        inputs.property "fcapip_version", fcapip_version

        filesMatching(["META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
            expand "version": version,
                    "minecraft_version": minecraft_version,
                    "fabric_version": loader_version,
                    "neo_version": forge_version,
                    "fcapip_version": fcapip_version
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = rootProject.archives_base_name
    version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}-${project.name}"
    group = rootProject.maven_group

    repositories {
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
            content {
                excludeGroupByRegex "org.parchmentmc"
            }
        }
        maven {
            name = "RedlanceMinecraft"
            url = "https://repo.redlance.org/public"
        }
        maven {
            name = "ParchmentMC"
            url = "https://maven.parchmentmc.org"
        }
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set 21
    }

    java {
        withSourcesJar()
    }

    publishing {
        repositories {
        }
    }
}