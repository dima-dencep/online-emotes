architectury {
    common("neoforge", "fabric")
}

loom {
    accessWidenerPath = file("src/main/resources/online-emotes.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${fcapip_version}"
    modCompileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcapip_version}") {
        transitive = false
    }

    // EmoteCraft
    modImplementation "io.github.kosmx.emotes:archCommon:${emotecraft_version}"

    // Third-party
    implementation("org.redlance.platformtools:common:$platformtools_version") { transitive = false }
    implementation("org.redlance.platformtools:referer:$platformtools_version") { transitive = false }
}

jar {
    from rootProject.file("LICENSE")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
